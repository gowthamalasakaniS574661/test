<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Detector</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #5f6368;
        }
        select, textarea, input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            background-color: #1a73e8;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #155ab6;
        }
        .loader {
            display: none;
            text-align: center;
            padding: 20px;
            font-weight: bold;
            color: #1a73e8;
        }
        #results {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            white-space: pre-wrap; /* This preserves formatting like newlines */
            line-height: 1.6;
        }
        .disclaimer {
            font-size: 12px;
            color: #888;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌿 Plant Disease Detector</h1>
        <form id="predictForm">
            <div class="form-group">
                <label for="language">Choose your language:</label>
                <select id="language" name="language">
                    <option value="English">English</option>
                    <option value="Telugu">Telugu (తెలుగు)</option>
                    <option value="Hindi">Hindi (हिन्दी)</option>
                    <option value="Tamil">Tamil (தமிழ்)</option>
                    <option value="Kannada">Kannada (ಕನ್ನಡ)</option>
                    <option value="Malayalam">Malayalam (മലയാളം)</option>
                    <option value="Spanish">Spanish (Español)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="image">Upload a photo of the crop:</label>
                <input type="file" id="image" name="image" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="symptoms">Describe any symptoms (optional):</label>
                <textarea id="symptoms" name="symptoms" placeholder="e.g., Yellow spots on leaves, wilting stems..."></textarea>
            </div>
            <button type="submit">Predict Disease</button>
        </form>

        <div class="loader" id="loader">Analyzing... Please wait.</div>
        <div id="results"></div>
        <div class="disclaimer">
            This is an AI prediction and for informational purposes only. Always consult a local agricultural expert.
        </div>
    </div>

    <script>
        const form = document.getElementById('predictForm');
        const loader = document.getElementById('loader');
        const resultsDiv = document.getElementById('results');

        form.addEventListener('submit', async (event) => {
            event.preventDefault(); // Prevent the default form submission

            // Show loader and clear previous results
            loader.style.display = 'block';
            resultsDiv.innerHTML = '';

            const formData = new FormData(form);

            try {
                // The URL of our Flask backend endpoint
                const response = await fetch('http://127.0.0.1:5000/api/predict', {
                    method: 'POST',
                    body: formData // FormData handles multipart/form-data encoding
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                resultsDiv.textContent = data.prediction;

            } catch (error) {
                console.error('Error:', error);
                resultsDiv.textContent = `An error occurred: ${error.message}`;
            } finally {
                // Hide loader
                loader.style.display = 'none';
            }
        });
    </script>

</body>
</html>
